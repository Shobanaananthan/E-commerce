
{% extends "shop/base.html" %}

{% block title %}Sign In | ShopEase{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 440px;
        margin: 5rem auto;
        padding: 0 1rem;
    }
    
    .auth-card {
        background: var(--card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        padding: 2.5rem;
    }
    
    .auth-icon {
        width: 64px;
        height: 64px;
        background: var(--primary-light, #e0e7ff);
        color: var(--primary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem auto;
    }
    
    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .auth-header h1 {
        font-family: 'DM Sans', sans-serif;
        color: var(--text);
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
    }
    
    .auth-header p {
        color: var(--text-secondary);
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--text);
        font-size: 0.95rem;
    }
    
    .form-control {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        font-family: 'Inter', sans-serif;
        font-size: 1rem;
        color: var(--text);
        transition: var(--transition);
        background: var(--bg);
    }
    
    .form-control:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
        background: var(--card);
    }
    
    .btn-submit {
        width: 100%;
        justify-content: center;
        padding: 0.875rem;
        font-size: 1.05rem;
        margin-top: 0.5rem;
    }
    
    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border-light);
        color: var(--text-secondary);
    }
    
    .auth-footer a {
        color: var(--primary);
        font-weight: 600;
        text-decoration: none;
        transition: var(--transition);
    }
    
    .auth-footer a:hover {
        color: var(--accent);
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Sign in to your ShopEase account.</p>
        </div>
        
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-submit">Sign In</button>
        </form>
        
        <div class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Create one</a>
        </div>
    </div>
</div>
{% endblock %}
